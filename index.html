<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>UIFFA CUP </title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@800;900&family=Rajdhani:wght@700&display=swap');

        :root {
            --gold: #ffea00;
            --cyan: #00ffff;
            --red: #ff0055;
            --green: #00ff66;
            --arcade-dark: #12092b;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #05020c;
            color: #fff;
            font-family: 'Bangers', cursive, sans-serif;
            user-select: none;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 360px;
            background: radial-gradient(ellipse at 50% 30%, #2b1055 0%, #0d061f 60%, #030108 100%);
        }

        #stage {
            position: absolute;
            inset: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- HUD SUPERIOR (MARCADOR ARCADE) --- */
        .hud {
            position: absolute;
            z-index: 3;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: min(920px, calc(100% - 24px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }

        .brand {
            font: 900 clamp(16px, 3.5vw, 32px) 'Bangers', cursive;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 15px rgba(255, 234, 0, 0.8);
            transform: rotate(-2deg);
        }

            .brand small {
                display: block;
                font: 700 clamp(10px, 1.5vw, 14px) 'Bangers', cursive;
                letter-spacing: 3px;
                color: var(--cyan);
                text-shadow: 2px 2px 0 #000;
                margin-top: -2px;
            }

        .score {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            background: linear-gradient(180deg, #2a085c 0%, #130030 100%);
            border: 3px solid var(--cyan);
            border-radius: 12px;
            padding: 6px 14px;
            box-shadow: 4px 4px 0 #000, 0 0 15px rgba(0, 255, 255, 0.4);
            min-width: 80px;
            text-align: center;
            transform: skew(-6deg);
        }

            .stat b {
                display: block;
                font: 900 24px 'Bangers', cursive;
                color: var(--gold);
                text-shadow: 2px 2px 0 #000;
                letter-spacing: 1px;
            }

            .stat span {
                font: 700 12px 'Bangers', cursive;
                letter-spacing: 1.5px;
                color: #fff;
                text-shadow: 1px 1px 0 #000;
            }

        .phase {
            font: 900 16px 'Bangers', cursive;
            color: #fff;
            text-align: right;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 0 #000;
        }

            .phase span {
                display: block;
                color: var(--gold);
                font-size: 18px;
                text-shadow: 2px 2px 0 #000, 0 0 10px rgba(255, 234, 0, 0.6);
            }

        /* --- SECCIÓN INFERIOR Y CONTROLES DE DISPARO --- */
        .bottom {
            position: absolute;
            z-index: 4;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: min(780px, calc(100% - 22px));
            text-align: center;
        }

        #message {
            font: 900 clamp(18px, 3.5vw, 32px) 'Bangers', cursive;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 20px rgba(255, 234, 0, 0.9);
            margin-bottom: 12px;
            min-height: 38px;
            animation: pulseMessage 0.8s infinite alternate ease-in-out;
        }

        @keyframes pulseMessage {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.05);
            }
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin: 0 0 14px;
        }

        .dot {
            width: 26px;
            height: 10px;
            border-radius: 4px;
            background: #1a0b36;
            border: 2px solid #5d3896;
            box-shadow: 2px 2px 0 #000;
        }

            .dot.goal {
                background: var(--green);
                border-color: #fff;
                box-shadow: 0 0 15px var(--green), 2px 2px 0 #000;
            }

            .dot.save {
                background: var(--red);
                border-color: #fff;
                box-shadow: 0 0 15px var(--red), 2px 2px 0 #000;
            }

        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            touch-action: manipulation;
        }

        /* BOTONES DE TIRO RETRO/ARCADE */
        .shot {
            flex: 1;
            max-width: 210px;
            min-width: 0;
            min-height: 60px;
            touch-action: manipulation;
            border-radius: 14px;
            border: 3px solid #fff;
            background: linear-gradient(180deg, #ff0055 0%, #990033 100%);
            color: #fff;
            font: 900 18px 'Bangers', cursive;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 8px 0 #4a0018, 0 12px 20px #000a;
            cursor: pointer;
            transition: all 0.1s ease;
            transform: skew(-4deg);
        }

            .shot span {
                display: block;
                font: 700 13px 'Bangers', cursive;
                color: var(--gold);
                margin-top: 2px;
                letter-spacing: 1px;
                text-shadow: 1px 1px 0 #000;
            }

            .shot:hover:not(:disabled) {
                transform: skew(-4deg) translateY(-4deg);
                background: linear-gradient(180deg, #ff3377 0%, #cc0044 100%);
                box-shadow: 0 12px 0 #4a0018, 0 0 25px rgba(255, 0, 85, 0.8);
            }

            .shot:active:not(:disabled) {
                transform: skew(-4deg) translateY(4deg);
                box-shadow: 0 4px 0 #4a0018, 0 5px 10px #0008;
            }

            .shot:disabled {
                opacity: 0.4;
                filter: grayscale(1);
                cursor: not-allowed;
                box-shadow: 0 4px 0 #222;
            }

        /* --- CELEBRACIÓN DE GOL ESTILO ARCADE (PRESERVADA) --- */
        .goal-fx {
            position: absolute;
            z-index: 6;
            left: 50%;
            top: 39%;
            transform: translate(-50%, -50%) scale(.45) rotate(-7deg);
            pointer-events: none;
            opacity: 0;
            white-space: nowrap;
            font: 1000 clamp(42px, 11vw, 112px)/.9 Orbitron, sans-serif;
            font-style: italic;
            letter-spacing: -3px;
            color: #fff3a1;
            -webkit-text-stroke: 2px #b52a08;
            text-shadow: 4px 5px 0 #e34a08, 8px 10px 0 #65200c, 0 0 24px #ffdf43;
            filter: drop-shadow(0 8px 12px #000b);
        }

            .goal-fx::after {
                content: '⚽';
                display: inline-block;
                margin-left: .12em;
                font-size: .62em;
                color: #39f5ff;
                vertical-align: middle;
                -webkit-text-stroke: 0;
                text-shadow: 0 3px 8px #000;
            }

            .goal-fx.show {
                animation: goalBurst 2.65s cubic-bezier(.16, .8, .25, 1) both;
            }

        @keyframes goalBurst {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.25) rotate(-18deg);
            }

            18% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18) rotate(5deg);
            }

            32% {
                transform: translate(-50%, -50%) scale(.94) rotate(-3deg);
            }

            48% {
                transform: translate(-50%, -50%) scale(1.04) rotate(2deg);
            }

            78% {
                opacity: 1;
                transform: translate(-50%, -58%) scale(1) rotate(0);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -72%) scale(.88) rotate(0);
            }
        }

        /* --- OVERLAY & MODAL GENERAL --- */
        .overlay {
            position: absolute;
            z-index: 8;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(8, 3, 20, 0.88);
            backdrop-filter: blur(8px);
        }

        .panel {
            width: min(580px, 100%);
            border: 4px solid var(--gold);
            border-radius: 24px;
            padding: clamp(22px, 4vw, 36px);
            text-align: center;
            background: linear-gradient(180deg, #250a4d 0%, #0f0424 100%);
            box-shadow: 0 0 50px rgba(255, 234, 0, 0.3), inset 0 0 25px rgba(0, 0, 0, 0.8), 8px 8px 0 #000;
            transform: rotate(-1deg);
        }

        .eyebrow {
            font: 900 16px 'Bangers', cursive;
            letter-spacing: 3px;
            color: var(--cyan);
            text-shadow: 2px 2px 0 #000;
        }

        h1 {
            font: 900 clamp(36px, 8vw, 64px) 'Bangers', cursive;
            margin: 8px 0 2px;
            color: #fff;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 0 0 30px rgba(0, 255, 255, 0.6);
            letter-spacing: 2px;
            transform: rotate(-1deg);
        }

            h1 em {
                font-style: normal;
                color: var(--gold);
                text-shadow: 4px 4px 0 #000, 0 0 30px rgba(255, 234, 0, 0.9);
            }

        .lead {
            font: 700 20px 'Bangers', cursive;
            color: #e0d5ff;
            line-height: 1.3;
            margin: 10px auto 22px;
            max-width: 470px;
            text-shadow: 1.5px 1.5px 0 #000;
            letter-spacing: 1px;
        }

        .rules {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0 26px;
        }

        .rule {
            border: 3px solid var(--cyan);
            background: #170736;
            border-radius: 16px;
            padding: 12px 8px;
            box-shadow: 4px 4px 0 #000;
            transform: skew(-3deg);
        }

            .rule b {
                display: block;
                color: var(--gold);
                font: 900 24px 'Bangers', cursive;
                text-shadow: 2px 2px 0 #000;
            }

            .rule span {
                font: 700 13px 'Bangers', cursive;
                color: #fff;
                letter-spacing: 1px;
                text-shadow: 1px 1px 0 #000;
            }

        /* BOTÓN PRINCIPAL START / REPLAY */
        .primary {
            border: 3px solid #fff;
            border-radius: 20px;
            padding: 16px 36px;
            background: linear-gradient(180deg, #00ff66 0%, #009933 100%);
            color: #fff;
            font: 900 24px 'Bangers', cursive;
            letter-spacing: 2px;
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 6px 0 #ffea00, 0 12px 25px rgba(0, 255, 102, 0.5);
            transition: all 0.1s ease;
            transform: skew(-4deg);
        }

            .primary:hover {
                background: linear-gradient(180deg, #33ff85 0%, #00cc44 100%);
                transform: skew(-4deg) translateY(-3deg);
                box-shadow: 0 11px 0 #004d1a, 0 0 30px rgba(0, 255, 102, 0.8);
            }

            .primary:active {
                transform: skew(-4deg) translateY(4deg);
                box-shadow: 0 3px 0 #004d1a;
            }

        .hint {
            font: 700 14px 'Bangers', cursive;
            color: var(--cyan);
            margin-top: 16px;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 0 #000;
        }

        .hide {
            display: none !important;
        }

        /* --- MEDIA QUERIES (ADAPTADOS PARA GOAL-FX Y MÓVILES) --- */
        @media(max-width:960px) {
            .goal-fx {
                top: 46%;
                font-size: clamp(48px, 14vw, 84px);
                -webkit-text-stroke: 1.5px #b52a08;
                text-shadow: 3px 4px 0 #e34a08, 5px 7px 0 #65200c, 0 0 18px #ffdf43;
            }
        }

        @media(orientation:landscape) and (max-height:520px) {
            .hud {
                top: 5px;
            }

            .bottom {
                bottom: 5px;
            }

            .shot {
                min-height: 42px;
            }

            .goal-fx {
                top: 42%;
                font-size: clamp(38px, 9vh, 70px);
            }
        }

        @media(max-width:620px) {
            .hud {
                top: 8px;
                align-items: flex-start;
            }

            .brand {
                font-size: 11px;
                letter-spacing: 1px;
            }

                .brand small {
                    font-size: 8px;
                }

            .stat {
                padding: 5px 7px;
                min-width: 52px;
            }

                .stat b {
                    font-size: 14px;
                }

                .stat span {
                    font-size: 8px;
                }

            .phase {
                font-size: 9px;
            }

                .phase span {
                    font-size: 8px;
                }

            .bottom {
                bottom: max(9px, env(safe-area-inset-bottom));
            }

            .shot {
                min-height: 49px;
                font-size: 10px;
                padding: 5px 2px;
            }

                .shot span {
                    font-size: 9px;
                }

            .controls {
                gap: 6px;
            }

            .shot {
                min-height: 52px;
                border-radius: 10px;
            }

            #message {
                font-size: 12px;
                margin-bottom: 8px;
            }

            .panel {
                padding: 22px 16px;
            }

            .lead {
                font-size: 15px;
            }

            .rule {
                padding: 9px 4px;
            }

                .rule b {
                    font-size: 15px;
                }
        }
    </style>

</head>
<body>
<div id="app">
 <div id="stage"></div><button id="soundToggle" aria-label="Activar o silenciar sonido" style="position:absolute;z-index:8;right:12px;top:66px;border:1px solid #ffe36b88;border-radius:22px;background:#080b18b8;color:#ffe36b;padding:8px 11px;font:900 12px Arial;box-shadow:0 0 14px #ffcf3344">🔊 AUDIO</button>\n  <div class="goal-fx" id="goalFx" aria-hidden="true">GOAL!</div>
 <div class="hud">
  <div class="brand">UIFFA CUP<small>🕹️🕹️🕹️🕹️</small></div>
  <div class="score">
   <div class="stat"><b id="stageNo">1/5</b><span>Stage</span></div>
   <div class="stat"><b id="goals">0</b><span>Goals</span></div>
   <div class="stat"><b id="saves">0</b><span>Saves</span></div>
   <div class="stat"><b id="shotNo">1/5</b><span>Shot</span></div>
  </div>
  <div class="phase" id="keeperLevel">Goalie<span>NIVEL 1</span></div>
 </div>
 <div class="bottom">
  <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  <div id="message">CHOOSE WHERE TO PLACE YOUR SHOT</div>
  <div class="controls" id="controls">
      <button class="shot" data-dir="left" disabled>◀ Left <span>Placed</span></button>
      <button class="shot" data-dir="center" disabled>▲ 𝘾enter<span>To the body</span></button>
   <button class="shot" data-dir="right" disabled>Right ▶<span>Placed</span></button>
  </div>
 </div>
 <div class="overlay" id="intro"><div class="panel">
                                     <div class="eyebrow">Penalty ⚽🏃‍</div><h1>UIFFA <em>CUP</em></h1>
  <div class="lead">ENTER THE STADIUM AND CHALLENGE THE 5 GOALKEEPERS</div>
  <div class="rules"><div class="rule"><b>5</b><span>PENALTY KICKS</span></div><div class="rule"><b>3 ⚽</b><span>GOALS TO ADVANCE</span></div><div class="rule"><b>3 🧤</b><span>AND YOU LOSE</span></div></div>
  <button class="primary arcade-start" id="start">▶ PLAY NOW</button><div class="hint">EACH ROUND WILL BRING A BETTER GOALKEEPER</div>
 </div></div>
 <div class="overlay hide" id="result"><div class="panel"><div class="eyebrow" id="resultEyebrow">ROUND COMPLETED</div><h1 id="resultTitle">GOOD!</h1><div class="lead" id="resultText"></div><button class="primary" id="continue">CONTINUAR</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script>
const mount=document.getElementById('stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fc5e8);scene.fog=new THREE.Fog(0x8fc5e8,42,105);
const camera=new THREE.PerspectiveCamera(42,1,.1,120);camera.position.set(0,4.8,13.2);camera.lookAt(0,2.65,-5.0);
const isMobile=matchMedia('(max-width: 700px)').matches;const renderer=new THREE.WebGLRenderer({antialias:!isMobile,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.25:1.8));renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe2f4ff,0x315c32,1.35));
const key=new THREE.DirectionalLight(0xfff0cf,2.0);key.position.set(-8,18,10);key.castShadow=false;scene.add(key);
for(const [x,z] of [[-12,-5],[12,-5],[-9,5],[9,5]]){const l=new THREE.SpotLight(0xd5e4ed,145,46,Math.PI/5,.55,1.4);l.position.set(x,11,z);l.target.position.set(0,1,-5);scene.add(l,l.target);}
const mat=(color,rough=.7,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const turf=mat(0x34864a,.99),darkTurf=mat(0x2b7540,.99),white=mat(0xe8eee8,.82),steel=mat(0xcbd5d4,.72,.05),netMat=new THREE.MeshStandardMaterial({color:0xd7e7ec,roughness:1,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
// Textura artesanal del césped: variación fina de tonos y briznas, sin brillo plástico.
const grassCanvas=document.createElement('canvas');grassCanvas.width=grassCanvas.height=1024;const gc=grassCanvas.getContext('2d');
gc.fillStyle='#34864a';gc.fillRect(0,0,1024,1024);
for(let i=0;i<18000;i++){const x=Math.random()*1024,y=Math.random()*1024;gc.strokeStyle=Math.random()>.5?'rgba(190,220,145,.16)':'rgba(9,55,20,.12)';gc.lineWidth=.5+Math.random()*1.2;gc.beginPath();gc.moveTo(x,y);gc.lineTo(x+(Math.random()-.5)*3,y-2-Math.random()*7);gc.stroke();}
for(let i=0;i<90;i++){gc.fillStyle=i%2?'rgba(0,0,0,.018)':'rgba(160,180,120,.018)';gc.fillRect(i*12,0,6,1024);}
const grassTex=new THREE.CanvasTexture(grassCanvas);grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(4,5);grassTex.colorSpace=THREE.SRGBColorSpace;turf.map=grassTex;darkTurf.map=grassTex;
function box(w,h,d,m,x,y,z,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
// pitch and mowing stripes
box(44,.35,48,turf,0,-.22,-5,false);
for (let i = 0; i < 8; i++)box(44, .012, 5.9, i % 2 ? darkTurf : turf, 0, -.035, -25 + i * 5.9, false);

// ==========================================
// BANDERAS Y PANCARTAS ESTILO TRIBUNA SUDAMERICANA
// ==========================================
function createSupporterBanner(x, y, z, width, height, colors, rotationY = 0) {
    const canvas = document.createElement('canvas');
    canvas.width = 912;
    canvas.height = 246;
    const ctx = canvas.getContext('2d');

    // Franjas verticales características de los trapos de barra
    const stripeWidth = canvas.width / colors.length;
    colors.forEach((col, index) => {
        ctx.fillStyle = col;
        ctx.fillRect(index * stripeWidth, 0, stripeWidth + 2, canvas.height);
    });

    // Texto de aguante con estilo rotulado
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 76px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(' ✌︎㋡ ⋆˚࿔ 𝓑𝒜ℛℛ𝒜 𝓑ℛ𝒜𝓋𝒜 ˚⋆˚࿔˚ ✌︎㋡', canvas.width / 2, canvas.height / 2);

    const texture = new THREE.CanvasTexture(canvas);
    const geometry = new THREE.PlaneGeometry(width, height);

    const material = new THREE.MeshStandardMaterial({
        map: texture,
        side: THREE.DoubleSide,
        roughness: 0.7
    });

    const banner = new THREE.Mesh(geometry, material);
    banner.position.set(x, y, z);
    banner.rotation.y = rotationY;
    scene.add(banner);

    return banner;
}

// Colocarlas bien ancladas en las paredes/respaldos superiores de las gradas (lejos de la portería)
// Tribuna de fondo (atrás del todo)
createSupporterBanner(-6, 11.5, -38, 7, 2.5, ['#ff0000', '#ffffff', '#0000ff'], 0);
createSupporterBanner(6, 11.5, -38, 7, 2.5, ['#ffea00', '#000000', '#ffea00'], 0);

// Tribunas laterales (costados)
createSupporterBanner(-22, 10, -25, 6, 2.2, ['#00ff66', '#ffffff', '#000088'], Math.PI / 3);
createSupporterBanner(22, 10, -25, 6, 2.2, ['#ff0055', '#ffff00', '#111111'], -Math.PI / 3);


// CUATRO BANDERAS VERTICALES GRANDES EN LA ÚLTIMA FILA DE LA TRIBUNA.
// La tela tiene malla propia para ondear suavemente sin imágenes externas.
const wavingFlags=[];
function createVerticalFlag(x,z,colors,label){
 const poleMat=mat(0xb9c5d0,.32,.65),pole=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,4.25,10),poleMat);
 pole.position.set(x,14.1,z);scene.add(pole);
 const w=2.25,h=3.35,nx=18,ny=24,positions=[],uv=[],indices=[];
 for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){positions.push((i/nx-.5)*w, -(j/ny)*h, 0);uv.push(i/nx,1-j/ny);if(i<nx&&j<ny){const a=j*(nx+1)+i,b=a+1,c=a+nx+1,d=c+1;indices.push(a,c,b,b,c,d);}}
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=768;const cx=canvas.getContext('2d');

const bodyGeo = new THREE.CylinderGeometry(0.15, 0.10, 0.35, 8); // Torso
const headGeo = new THREE.SphereGeometry(0.09, 6, 6);            // Cabeza
const skinMat = mat(0xffdbac);                                   // Tono de piel base
const crowdMats = [
    mat(0xe7e9e6), mat(0xd7b45d), mat(0x4e91ba),
    mat(0xb94b52), mat(0x26313b), mat(0x2ecc71)
];

const crowdMeshes = [];

for (let c = 0; c < crowdMats.length; c++) {
    // MANTNER separadas  cuerpos y cabezas 
    const bodyInst = new THREE.InstancedMesh(bodyGeo, crowdMats[c], 450);
    const headInst = new THREE.InstancedMesh(headGeo, skinMat, 450);
    let n = 0;
    const dummy = new THREE.Object3D();

    for (let row = 0; row < totalRows; row++) {
        const zBase = -22 - row * 1.05;
        const y = 1.35 + row * 0.62;
        const xOffset = 17 + row * 0.45;
        const anchoFondo = xOffset * 2;
        const colCount = Math.floor(anchoFondo / 1.3);

        // --- Fondo ---
        for (let col = 0; col < colCount; col++) {
            if ((row * colCount + col) % crowdMats.length !== c) continue;
            const xPos = -xOffset + 0.8 + col * 1.3;

            if (n < 450) {
                // Posicionar cuerpo
                dummy.position.set(xPos, y, zBase);
                dummy.scale.set(1, 1, 1);
                dummy.updateMatrix();
                bodyInst.setMatrixAt(n, dummy.matrix);

                // cabeza justo encima del torso
                dummy.position.set(xPos, y + 0.26, zBase);
                dummy.updateMatrix();
                headInst.setMatrixAt(n, dummy.matrix);

                if (!bodyInst.userData.basePositions) bodyInst.userData.basePositions = [];
                bodyInst.userData.basePositions[n] = { x: xPos, y: y, z: zBase, headY: y + 0.26, offset: Math.random() * Math.PI * 2 };
                n++;
            }
        }

        // --- Costados ---
        const profLateral = 22 + row * 0.3;
        const depthCount = Math.floor(profLateral / 1.3);

        for (let d = 0; d < depthCount; d++) {
            if ((row * depthCount + d + 2) % crowdMats.length !== c) continue;
            const zPos = zBase + d * 1.3;

            // Izquierda
            const xLeft = -xOffset - 0.2 + (d * 0.12);
            if (n < 450) {
                dummy.position.set(xLeft, y, zPos);
                dummy.rotation.y = 0.08;
                dummy.updateMatrix();
                bodyInst.setMatrixAt(n, dummy.matrix);

                dummy.position.set(xLeft, y + 0.26, zPos);
                dummy.updateMatrix();
                headInst.setMatrixAt(n, dummy.matrix);

                if (!bodyInst.userData.basePositions) bodyInst.userData.basePositions = [];
                bodyInst.userData.basePositions[n] = { x: xLeft, y: y, z: zPos, headY: y + 0.26, offset: Math.random() * Math.PI * 2 };
                n++;
            }

            // Derecha
            const xRight = xOffset + 0.2 - (d * 0.12);
            if (n < 450) {
                dummy.position.set(xRight, y, zPos);
                dummy.rotation.y = -0.08;
                dummy.updateMatrix();
                bodyInst.setMatrixAt(n, dummy.matrix);

                dummy.position.set(xRight, y + 0.26, zPos);
                dummy.updateMatrix();
                headInst.setMatrixAt(n, dummy.matrix);

                if (!bodyInst.userData.basePositions) bodyInst.userData.basePositions = [];
                bodyInst.userData.basePositions[n] = { x: xRight, y: y, z: zPos, headY: y + 0.26, offset: Math.random() * Math.PI * 2 };
                n++;
            }
        }
    }
    scene.add(bodyInst);
    scene.add(headInst);
    crowdMeshes.push({ body: bodyInst, head: headInst });
}

const dummyAnim = new THREE.Object3D();

function animateCrowd(time) {
    const t = time * 0.004;

    // Animar humo (flotar levemente)
    flareGroup.children.forEach((puff, idx) => {
        puff.position.y += Math.sin(t + idx) * 14.13;
        puff.scale.x = 1 + Math.sin(t * 2 + idx) * 6.1;
        puff.scale.y = 1 + Math.cos(t * 2 + idx) * 11.1;
    });

    // Animar la multitud (cuerpo y cabeza saltando juntos)
    crowdMeshes.forEach(({ body, head }) => {
        const positions = body.userData.basePositions;
        if (!positions) return;

        for (let i = 0; i < positions.length; i++) {
            const pos = positions[i];

            const jump = Math.sin(t * 3.5 + pos.offset + pos.x * 0.3) * 0.12;
            const bounceY = Math.max(0, jump);
            const swayX = Math.cos(t * 2 + pos.offset) * 0.03;

            // Mover Torso
            dummyAnim.position.set(pos.x + swayX, pos.y + bounceY, pos.z);
            dummyAnim.scale.set(1, 1 + bounceY * 0.6, 1);
            dummyAnim.updateMatrix();
            body.setMatrixAt(i, dummyAnim.matrix);

            // Mover Cabeza de forma sincronizada con el torso
            dummyAnim.position.set(pos.x + swayX, pos.headY + bounceY, pos.z);
            dummyAnim.scale.set(1, 1, 1); // La cabeza no se estira, solo salta
            dummyAnim.updateMatrix();
            head.setMatrixAt(i, dummyAnim.matrix);
        }
        body.instanceMatrix.needsUpdate = true;
        head.instanceMatrix.needsUpdate = true;
    });
}

let impact={active:false,x:0,y:1.2,power:0,time:0};
function netPush(x,y,z,now=0){
 const dx=x-impact.x,dy=y-impact.y,dist=Math.sqrt(dx*dx+dy*dy);
 const idle=Math.sin(now*1.35+x*.34+y*.55+z*.2)*.009;
 if(!impact.active)return idle;
 const local=Math.exp(-(dx*dx/8.5+dy*dy/5.2));
 const wave=Math.sin(impact.time*19-dist*2.45)*Math.exp(-dist*.23)*impact.power*.82;
 const pocket=(1-Math.exp(-impact.time*11))*local*impact.power*2.45;
 const traveling=Math.sin(impact.time*12-dist*1.3)*Math.exp(-dist*.13)*impact.power*.34;
 return idle+pocket+wave+traveling;
}

function netAnchor(kind,x,y,z){
 const clamp=v=>Math.max(0,Math.min(1,v));
 const ease=v=>{v=clamp(v);return v*v*(3-2*v);};
 let d;
 if(kind==='back') d=Math.min(goalW/2-Math.abs(x),y,goalH-y);
 else if(kind==='roof') d=Math.min(goalW/2-Math.abs(x),Math.abs(z-goalZ),Math.abs(z-(goalZ-depth)));
 else if(kind==='left'||kind==='right') d=Math.min(y,goalH-y,Math.abs(z-goalZ),Math.abs(z-(goalZ-depth)));
 else d=Math.min(goalW/2-Math.abs(x),Math.abs(z-goalZ),Math.abs(z-(goalZ-depth)));
 return ease(d/.62);
}

function finishShot(){const wasSave=anim.saved;if(wasSave){ArcadeAudio.save();saves++;shotResults.push('save');if(!anim?.catchBall)message('WHAT A SAVE! THE GOALKEEPER DEFLECTED IT.','red');}else{ArcadeAudio.goal();goals++;shotResults.push('goal');showGoalFx();message('GOAL!!!, WHAT A GREAT SHOT','green');}
updateHUD();
// stop motion and wait a beat before next play
setTimeout(()=>{if(saves>=3){endPhase(false);return;}if(goals>=3){endPhase(true);return;}if(shot>=5){endPhase(goals>=3);return;}shot++;updateHUD();resetPositions();locked=false;message('NEXT PENALTY');setButtons(false);},1900);
}
function endPhase(passed) {
    active = false; locked = true; setButtons(true); if (passed) { if (bossMode) { $('resultEyebrow').textContent = 'WORLD CHAMPION'; $('resultTitle').innerHTML = 'LEGEND <em>UIFFA!</em>'; $('resultText').textContent ='You defeated the best goalkeeper in the world! You conquered all five stages and the secret challenge.';$('continue').textContent='JUGAR DE NUEVO';$('continue').onclick=()=>{phase=1;bossMode=false;goals=0;saves=0;shot=1;shotResults=[];setPhaseLook();updateHUD();$('result').classList.add('hide');resetPositions();active=true;locked=false;message('¡EL CAMPEÓN VUELVE A LA CANCHA!');setButtons(false);};}else if(phase===5){$('resultEyebrow').textContent='SE DESBLOQUEA EL DESAFÍO SECRETO';$('resultTitle').innerHTML='¡JEFE <em>SOMBRA!</em>';$('resultText').textContent='Has conquistado las cinco fases. Pero en el estadio oscuro despierta un guardameta supersónico. ¿Te atreves a enfrentarlo?';$('continue').textContent='DESAFIAR AL JEFE SOMBRA';$('continue').onclick=()=>{bossMode=true;goals=0;saves=0;shot=1;shotResults=[];setPhaseLook();updateHUD();$('result').classList.add('hide');resetPositions();active=true;locked=false;message('FINAL GOALKEEPER');setButtons(false);};}else{$('resultEyebrow').textContent='FASE '+phase+' SUPERADA';$('resultTitle').textContent='¡CLASIFICADO!';$('resultText').textContent=`Marcaste ${goals} goles y avanzas a la ${phase===1?'segunda fase':phase===2?'tercera fase':phase===3?'cuarta fase':'quinta fase'}. El próximo portero será más difícil.`;$('continue').textContent='AVANZAR DE FASE';$('continue').onclick=()=>{phase++;goals=0;saves=0;shot=1;shotResults=[];setPhaseLook();updateHUD();$('result').classList.add('hide');resetPositions();active=true;locked=false;message('NUEVA FASE · PORTERO MÁS EXIGENTE');setButtons(false);};}}else{$('resultEyebrow').textContent='FIN DEL CAMINO';$('resultTitle').textContent='YOU LOST';$('resultText').textContent=`Conseguiste ${goals} goles y recibiste ${saves} atajadas. ¡Vuelve a intentarlo y conquista la copa!`;$('continue').textContent='REINTENTAR CAMPEONATO';$('continue').onclick=()=>{phase=1;bossMode=false;goals=0;saves=0;shot=1;shotResults=[];setPhaseLook();updateHUD();$('result').classList.add('hide');resetPositions();active=true;locked=false;message('¡VAMOS POR EL CAMPEONATO!');setButtons(false);};}
$('result').classList.remove('hide');}
// Animación del penal: trayectoria, contacto con el arquero/red y física de rebotes.
function updateShot(now){
 if(!anim)return;const a=anim;
 if(!a.hit){
  const t=Math.min(1,(now-a.start)/a.duration),ease=t*t*(3-2*t);
  const endZ=a.saved?goalZ+.20:goalZ-depth+.46;
  const curve=Math.sin(Math.PI*t);
  ballGroup.position.x=a.targetX*ease+Math.sin(t*Math.PI*1.25)*.12;
  ballGroup.position.y=.45+(a.targetY-.45)*ease+curve*(a.saved?.82:1.02);
  ballGroup.position.z=7.1+(endZ-7.1)*ease;
  ballGroup.rotation.x=t*12.5;ballGroup.rotation.z=t*9.4;
  const dive=ease,side=a.keeperDir==='left'?1:a.keeperDir==='right'?-1:0;
  keeper.position.x=a.kx*dive;
  keeper.position.y=keeperHome.y+(a.keeperDir==='center'?.30:.66)*Math.sin(Math.PI*t*.88)*dive;
  keeper.position.z=keeperHome.z+.18*dive;
  keeper.rotation.z=side*1.30*dive;keeper.rotation.x=-.24*dive;keeper.rotation.y=side*.22*dive;
  armPivots.forEach(o=>{if(o.leg){o.pivot.rotation.z=(side===0?(o.s===-1?-.5:.5):-o.s*1.12)*dive;o.pivot.rotation.x=.28*dive;}else{o.pivot.rotation.z=(side===0?o.s*.85:o.s*1.48)*dive;o.pivot.rotation.x=-.32*dive;}});
  if(t>=1){
   a.hit=true;a.hitAt=now;a.lastPhysics=now;
   if(!a.saved){
    impact={active:true,x:a.targetX,y:a.targetY,power:1.55,time:0};
    // El balón golpea el fondo de la red, rebota hacia el área y cae con botes sucesivos.
    a.ballV={x:(a.targetX*.08),y:-1.0,z:2.4};a.groundBounces=0;
    ballGroup.position.set(a.targetX,a.targetY,goalZ-depth+.46);
   }else{
    // El portero puede blocar limpio o desviar con un rebote potente.
    a.catchBall=Math.random()<.2;
       if (a.catchBall) { a.ballV = null; message('GREAT SAVE! THE GOALKEEPER HOLDS ONTO THE BALL.','red');}
    else{a.ballV={x:(a.dir==='left'?1.5:a.dir==='right'?-1.5:0),y:12.4,z:8.35};a.groundBounces=0;message('THE GOALKEEPER DEFLECTS IT!','red');}
   }
  }
  return;
 }
 const dt=Math.min(.04,Math.max(.001,(now-a.lastPhysics)/1000));a.lastPhysics=now;
 if(a.saved&&a.catchBall){
  // El guardameta asegura la pelota entre las manos y el pecho; sin rebote falso.
  const settle=Math.min(1,(now-a.hitAt)/380);
  ballGroup.position.set(a.kx*.86,1.18,keeperHome.z+.48);
  ballGroup.rotation.x*=.94;ballGroup.rotation.z*=.94;
  keeper.position.y=Math.max(.06,keeper.position.y*(1-settle*.18));
 }else{
  const v=a.ballV;
  // Integración sencilla con gravedad, fricción y restitución para que el balón bote de verdad.
  v.y-=9.2*dt;
  ballGroup.position.x+=v.x*dt;ballGroup.position.y+=v.y*dt;ballGroup.position.z+=v.z*dt;
  v.x*=Math.pow(.985,dt*60);v.z*=Math.pow(.992,dt*60);
  if(ballGroup.position.y<.48){
   ballGroup.position.y=.48;
   if(Math.abs(v.y)>.72&&a.groundBounces<4){v.y=Math.abs(v.y)*.66;a.groundBounces++;v.x*=.88;v.z*=.84;}
   else{v.y=0;v.x*=.78;v.z*=.78;}
  }
  // Rodamiento y giro visual sincronizados con el desplazamiento.
  ballGroup.rotation.x+=Math.max(.025,Math.abs(v.z)*dt*1.8);
  ballGroup.rotation.z+=v.x*dt*1.4;
 }
 // El portero aterriza por completo y permanece sobre el césped.
 const fall=Math.min(1,(now-a.hitAt)/330);
 keeper.position.y=Math.max(.30,keeper.position.y*(1-fall*.62));
 // Tiempo extra para ver la caída y los rebotes antes de anunciar el resultado.
 const elapsed=(now-a.hitAt)/1000;
 if(elapsed>(a.saved&&a.catchBall?1.35:2.65)&&!a.done){
  a.done=true;finishShot();anim=null;
 }
}
// idle keeper breathing, subtle net movement and camera micro motion
const clock=new THREE.Clock();function animate(now){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);deformNet(dt);updateTurfBurst(dt);animateFlags(now*.001);if(anim)updateShot(now);else if(active&&!locked){keeper.position.y=keeperHome.y+Math.sin(now*.0017)*.012;keeper.rotation.z=Math.sin(now*.0012)*.009;}
renderer.render(scene,camera);}requestAnimationFrame(animate);
function resize(){
 const w=mount.clientWidth,h=mount.clientHeight,aspect=w/h;
 renderer.setSize(w,h,false);camera.aspect=aspect;
 if(w<650){
  // Encuadre vertical: aleja la cámara y calcula el FOV para que quepa
  // toda la anchura del arco, incluidos ambos postes, incluso en móviles estrechos.
  const camZ=17.5,targetZ=-7.2,dist=camZ-targetZ;
  camera.position.set(0,4.8,camZ);
  camera.lookAt(0,2.5,targetZ);
  const requiredWidth=13.6+2.2;
  camera.fov=Math.min(74,Math.max(54,2*Math.atan(requiredWidth/(2*dist*aspect))*180/Math.PI));
 }else{
  camera.fov=40;camera.position.set(0,4.05,12.8);camera.lookAt(0,2.6,-7.2);
 }
 camera.updateProjectionMatrix();
}new ResizeObserver(resize).observe(mount);resize();setPhaseLook();updateHUD();
